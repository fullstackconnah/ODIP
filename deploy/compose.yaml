services:
  db:
    image: postgres:16-alpine
    container_name: odip-db
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      POSTGRES_DB: odip
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: odip-api:local
    container_name: odip-api
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=odip;Username=postgres;Password=${POSTGRES_PASSWORD};Trust Server Certificate=true;SSL Mode=Disable
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - FIREBASE_SERVICE_ACCOUNT_JSON=/credentials/firebase.json
      # Password-less dev login. LAN-only instances ONLY — never set this on an
      # internet-reachable host or one holding real participant data.
      - DEV_AUTH_ENABLED=${DEV_AUTH_ENABLED:-false}
      # The API refuses to start with DEV_AUTH_ENABLED=true in Production unless this is also true.
      - DEV_AUTH_ALLOW_IN_PRODUCTION=${DEV_AUTH_ALLOW_IN_PRODUCTION:-false}
      # Demo-data top-up (an hourly job that keeps the Demo tenant's roster and leave current). Off unless the host's .env sets
      # DEMO_DATA_SCENARIOS=On; CI and the image build never set it. See odip-prototype/odip/backend/Odip.Infrastructure/DemoData.
      - DemoData__Scenarios=${DEMO_DATA_SCENARIOS:-Off}
      # Which packs of the top-up may run, comma-separated by name; empty is all of them. A new pack ships Off by listing every pack but it
      # here, and is brought up later by editing the list. See docs/runbooks/demo-data.md.
      - DemoData__Packs=${DEMO_DATA_PACKS:-}
      # Employment Hero Payroll (Settings → Integrations). INTEGRATIONS_MASTER_KEY is 32 random bytes, base64, kept only in the host's .env: it encrypts
      # every organisation's EH API key, and losing it means each Admin pastes their key again. Empty = integrations off, the rest of ODIP runs.
      - INTEGRATIONS_MASTER_KEY=${INTEGRATIONS_MASTER_KEY:-}
      - EmploymentHero__Enabled=${EMPLOYMENT_HERO_ENABLED:-true}
      # Two-step verification for Admins and SuperAdmins who sign in with a password. Off (the default) never refuses a sign-in and only logs the ones it would
      # refuse (MfaWouldRefuse); true refuses them until they set it up. To turn it on, add: - Auth__RequireMfaForAdmins=${REQUIRE_MFA_FOR_ADMINS:-false}
      # Sign in with Microsoft. Empty ClientId/ClientSecret = the feature is off. PublicBaseUrl must be the https origin users reach ODIP on.
      # The app registration must emit the wids claim (Token configuration -> groups claim -> Directory roles; UNVERIFIED whether Entra sends it by default, so check one real token at setup, beside xms_edov). Without it, linking a directory is refused.
      - Microsoft__ClientId=${MICROSOFT_CLIENT_ID:-}
      - Microsoft__ClientSecret=${MICROSOFT_CLIENT_SECRET:-}
      - Microsoft__PublicBaseUrl=${MICROSOFT_PUBLIC_BASE_URL:-}
      - DataProtection__KeysPath=/keys
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - documents:/data/documents
      - odip-dp-keys:/keys
      - /home/connah/secrets/odip/firebase-credentials.json:/credentials/firebase.json:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/api/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Worst-case startup: the retry loop in Program.cs:396-479 does up to 5
      # attempts with 2s/4s/8s/16s exponential backoff (30s total, Program.cs:475)
      # before migrate+seed runs, plus up to 60s cold-start margin for JIT and EF
      # migrations against a freshly-started Postgres (image pull time excluded).
      # 30s + 60s = 90s.
      start_period: 90s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Placeholder values — replace with a real Firebase web app config and
        # rebuild this image to enable login.
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
        # Must match DEV_AUTH_ENABLED on the api service. Baked in at build time,
        # so changing it requires rebuilding this image.
        VITE_DEV_AUTH: ${VITE_DEV_AUTH:-false}
        # The deployed commit, shown in the platform footer. deploy.yml sets GIT_SHA for the build; a hand-run
        # build gets "dev", which the footer hides.
        VITE_BUILD_SHA: ${GIT_SHA:-dev}
    image: odip-frontend:local
    container_name: odip-frontend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Public access: the homelab Cloudflare tunnel (remotely managed) maps https://bunya.connah.com.au -> http://192.168.4.70:8475.
    # nginx trusts CF-Connecting-IP only from hops inside the Docker range (nginx/default.conf): cloudflared and other containers on
    # this host arrive from the bridge gateway, LAN devices keep their own 192.168.x address and are not trusted. So the API rate
    # limiter and the "login" flood limiter (60 per 5 minutes) see each visitor, not the gateway.
    ports:
      - "8475:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  documents:
  odip-dp-keys:
