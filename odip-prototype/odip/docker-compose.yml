services:
  db:
    image: postgres:16-alpine
    container_name: odip-db
    environment:
      POSTGRES_DB: odip
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/fullstackconnah/odip-api:latest
    container_name: odip-api
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=odip;Username=postgres;Password=${POSTGRES_PASSWORD};Trust Server Certificate=true;SSL Mode=Disable
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - FIREBASE_SERVICE_ACCOUNT_JSON=/credentials/firebase.json
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - documents:/data/documents
      - /home/connah/secrets/odip/firebase-credentials.json:/credentials/firebase.json:ro

  frontend:
    image: ghcr.io/fullstackconnah/odip-frontend:latest
    container_name: odip-frontend
    ports:
      - "8475:80"
    depends_on:
      - api

volumes:
  pgdata:
  documents:
