server {
    listen 80;
    server_name _;

    # React SPA and the public landing page (/welcome/, its own HTML entry)
    root /usr/share/nginx/html;
    index index.html;

    # /welcome redirects to /welcome/ with a relative Location, so the published host port
    # (8475 -> 80) is not lost behind the container's port 80.
    absolute_redirect off;

    # Compress text responses (the nginx:alpine base ships gzip off): /welcome/ is about 75 KB of HTML,
    # 24 KB of CSS and 8 KB of JS raw. HTML is always included; images are already compressed.
    # If a proxy in front of this container compresses, remove this block.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # Proxy API requests to .NET backend
    location /api/ {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        client_max_body_size 50M;
    }

    # SPA fallback — all non-file requests go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (no add_header here: it would drop the server-level security headers; expires sets Cache-Control)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
    }

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; img-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
