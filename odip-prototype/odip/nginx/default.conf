server {
    listen 80;
    server_name _;

    # The public domain (https://bunya.connah.com.au) arrives through the Cloudflare tunnel, which sets CF-Connecting-IP to the visitor. Trust
    # that header only from cloudflared at 10.250.0.3 on the dedicated odip-tunnel network (deploy/compose.yaml: 10.250.0.0/29, frontend .2),
    # so no other container can choose its client IP. Not the whole /29: it includes the network gateway (.1). Loopback is trusted too: only a
    # process inside this container connects from 127.0.0.1 (a published port arrives from the gateway), which is how the e2e suite plays
    # cloudflared. LAN devices keep their own 192.168.x address (measured on live, 2026-10-17) and are not trusted. Cloudflare overwrites
    # CF-Connecting-IP at its edge, so public visitors cannot forge it. LAN requests carry no trusted header and keep their own address.
    # real_ip_recursive stays off (the default).
    set_real_ip_from 10.250.0.3/32;
    set_real_ip_from 127.0.0.1/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    # React SPA and the public landing page (/welcome/, its own HTML entry)
    root /usr/share/nginx/html;
    index index.html;

    # /welcome redirects to /welcome/ with a relative Location, so the published host port
    # (8475 -> 80) is not lost behind the container's port 80.
    absolute_redirect off;

    # Compress text responses (the nginx:alpine base ships gzip off): /welcome/ is about 31 KB of HTML,
    # 25 KB of CSS and 9 KB of JS raw. HTML is always included; images are already compressed.
    # If a proxy in front of this container compresses, remove this block.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml;

    # Proxy API requests to .NET backend
    location /api/ {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr (the visitor after real_ip), not $proxy_add_x_forwarded_for: a client or tunnel-supplied X-Forwarded-For never reaches the API.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        client_max_body_size 50M;

        # A 2,000-row onboarding import can take about a minute, past the 60 s default. Nested, so it keeps the headers above. No trailing
        # slash, so it also takes /api/v1/imports itself (history) without a 301 to add one.
        location /api/v1/imports {
            proxy_pass http://api:5000;
            proxy_read_timeout 180s;
        }

        # The data export flushes between tables, not inside one, so one big table can be silent for longer than the 60 s default.
        location /api/v1/data-export {
            proxy_pass http://api:5000;
            proxy_read_timeout 600s;
        }
    }

    # The emailed agreement link: a page under a secret token, so it adds noindex, no-store and no referrer. A location with its own add_header drops every
    # inherited one, so this block repeats ALL the server-level headers (nginxHeaders.test.ts holds the two lists equal). try_files serves index.html here, not by
    # redirect: a redirect to /index.html would be answered by that location, without these headers.
    location /agreement/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; img-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files /index.html =404;
    }
    # SPA fallback — all non-file requests go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (no add_header here: it would drop the server-level security headers; expires sets Cache-Control)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
    }

    # index.html is the entry for every route (try_files above ends here as an internal redirect), so it must revalidate on each load or a new
    # deploy shows only after a heuristic cache expiry. The hashed assets it names stay in the 1y cache. expires -1 sends no-cache and, unlike
    # add_header, keeps the server-level security headers.
    location = /index.html {
        expires -1;
    }

    # theme.js keeps its name (index.html loads it unhashed), so a changed script must not sit in the 1y cache above
    location = /theme.js {
        expires -1;
    }

    # The SW and manifest must never get the 1y asset cache or the SPA fallback. expires -1 (no add_header) keeps the server-level security headers.
    location = /sw.js { expires -1; try_files $uri =404; }
    location = /manifest.webmanifest { types { application/manifest+json webmanifest; } expires -1; try_files $uri =404; }

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; img-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
