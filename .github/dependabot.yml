version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directory: /odip-prototype/odip/backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directory: /odip-prototype/odip/frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
