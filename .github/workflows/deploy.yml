name: Deploy to homelab

# Runs on a self-hosted runner ON the homelab box (192.168.4.70), because the
# server is on a private LAN that GitHub-hosted runners cannot reach.
#
# A merged PR produces a push to main, so this covers merges and direct pushes.
# Only paths that affect the running app trigger a deploy — doc-only commits
# (Platform Plan/, *.md) are ignored.

on:
  push:
    branches: [main]
    paths:
      - 'odip-prototype/odip/backend/**'
      - 'odip-prototype/odip/frontend/**'
      - 'odip-prototype/odip/nginx/**'
      - 'deploy/compose.yaml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Never let two deploys touch the stack at once.
concurrency:
  group: deploy-homelab
  cancel-in-progress: false

jobs:
  # GitHub can start a run for an older main commit after a newer one has
  # merged, and the concurrency group only orders the runs. This job stops the
  # stale one so it cannot redeploy old images over the newer deploy.
  freshness:
    runs-on: [self-hosted, odip]
    timeout-minutes: 5

    outputs:
      stale: ${{ steps.check.outputs.stale }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip if main has moved past this commit
        id: check
        run: |
          set -euo pipefail
          stale=false
          # Only main is deployed from a moving tip; a manual run on another branch deploys what it was asked to.
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            git fetch --no-tags origin main
            tip=$(git rev-parse FETCH_HEAD)
            # Skip only when a newer commit changed something this deploy would ship.
            # A newer doc-only commit has no run of its own, so skipping for it would leave this commit undeployed.
            if [ "$tip" != "$GITHUB_SHA" ] && ! git diff --quiet "$GITHUB_SHA" "$tip" -- \
                 odip-prototype/odip/backend odip-prototype/odip/frontend odip-prototype/odip/nginx \
                 deploy/compose.yaml .github/workflows/deploy.yml; then
              stale=true
              echo "::notice::main has moved to $tip; the newer run deploys it"
            fi
          fi
          echo "stale=$stale" >> "$GITHUB_OUTPUT"

  deploy:
    needs: freshness
    if: needs.freshness.outputs.stale != 'true'
    runs-on: [self-hosted, odip]
    timeout-minutes: 45

    env:
      STACK_DIR: /mnt/docker/stacks/odip
      SRC_DIR: odip-prototype/odip
      HEALTH_URL: http://localhost:8475

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify stack directory exists
        run: |
          set -euo pipefail
          test -d "$STACK_DIR" || { echo "::error::$STACK_DIR not found — run the one-time server setup first"; exit 1; }
          test -f "$STACK_DIR/.env" || { echo "::error::$STACK_DIR/.env missing — secrets live on the server and are never committed"; exit 1; }

      - name: Wait for free memory
        # The deploy host also runs the test runner's jobs, and the image builds (dotnet publish, vite build) need headroom.
        run: |
          set -uo pipefail
          need_kb=$((4 * 1024 * 1024))
          for i in $(seq 1 30); do
            avail=$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)
            if [ $((i % 2)) -eq 1 ]; then echo "MemAvailable ${avail} kB (need ${need_kb} kB)"; fi
            if [ "$avail" -ge "$need_kb" ]; then echo "Enough free memory."; exit 0; fi
            sleep 30
          done
          echo "::error::Deploy host still has under 4 GiB available after 15 minutes; not building. Re-run the deploy when the test runner is quiet."
          exit 1

      - name: Tag rollback images
        run: |
          set -euo pipefail
          for img in odip-api odip-frontend; do
            if docker image inspect "$img:local" >/dev/null 2>&1; then
              docker tag "$img:local" "$img:rollback"
              echo "Tagged $img:rollback"
            else
              echo "No existing $img:local — first deploy, nothing to roll back to"
            fi
          done

      - name: Sync source into stack directory
        run: |
          set -euo pipefail
          # --delete keeps the stack tree honest, but .env holds the generated
          # Postgres password / JWT secret and must survive every deploy.
          # Removing the /backups/ exclude deletes the pre-deploy dumps (deploy/predeploy-dump.sh).
          rsync -a --delete \
            --exclude='.env' \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='bin' \
            --exclude='obj' \
            --exclude='dist' \
            --exclude='/backups/' \
            "$SRC_DIR"/ "$STACK_DIR"/
          cp deploy/compose.yaml "$STACK_DIR"/compose.yaml

      - name: Build images
        # This is the gate. If either image fails to compile the job stops here
        # and the currently running containers are left untouched.
        # The script retries (3 attempts) only on network faults, never on compile errors.
        env:
          GIT_SHA: ${{ github.sha }} # the platform footer's build number (deploy/compose.yaml, frontend/Dockerfile)
        run: |
          set -euo pipefail
          cd "$STACK_DIR"
          bash "$GITHUB_WORKSPACE/deploy/build-with-retry.sh"

      - name: Dump database before deploy
        # No continue-on-error: a failed dump stops the deploy before `up -d` and the old stack stays up.
        # Its id is not in the rollback step's condition (deploy or health failing), so a dump failure never triggers it.
        # Dumps land in $STACK_DIR/backups/predeploy (excluded from the rsync --delete above); the newest 5 are kept.
        id: dump
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd "$STACK_DIR"
          bash "$GITHUB_WORKSPACE/deploy/predeploy-dump.sh"

      - name: Restore image tags after a failed dump
        # The Build step ran before the dump, so :local points at images that never went live; put the previous ones back.
        if: failure() && steps.dump.outcome == 'failure'
        run: |
          set -euo pipefail
          for img in odip-api odip-frontend; do
            if docker image inspect "$img:rollback" >/dev/null 2>&1; then
              docker tag "$img:rollback" "$img:local"
              echo "Restored $img:local from $img:rollback"
            else
              echo "No $img:rollback — first deploy, nothing to restore"
            fi
          done

      - name: Deploy
        id: deploy
        # `up -d` now waits for the api container's healthcheck (deploy/compose.yaml)
        # before returning, and fails this step if api never turns healthy — that
        # failure hands off to the "Roll back on failed deploy or health check" step.
        run: |
          set -euo pipefail
          cd "$STACK_DIR"
          docker compose up -d

      - name: Health check
        id: health
        run: |
          set -uo pipefail
          cd "$STACK_DIR"
          # The compose healthcheck on /api/health/ready already gates this step:
          # `docker compose up -d` above blocks until the api container reports
          # healthy, since frontend.depends_on now requires api's
          # condition: service_healthy (deploy/compose.yaml). This loop confirms
          # the stack is reachable end-to-end through nginx afterward.
          for i in $(seq 1 30); do
            FE=$(curl -s -o /dev/null -w '%{http_code}' "$HEALTH_URL/" || echo 000)
            # Liveness through the frontend's nginx proxy — proves the API
            # process is up and being routed to correctly.
            API=$(curl -s -o /dev/null -w '%{http_code}' "$HEALTH_URL/api/health/live" || echo 000)
            # Readiness (database reachable) through the same proxy, not only liveness.
            READY=$(curl -s -o /dev/null -w '%{http_code}' "$HEALTH_URL/api/health/ready" || echo 000)
            echo "attempt $i: frontend=$FE api=$API ready=$READY"
            if [ "$FE" = "200" ] && [ "$API" = "200" ] && [ "$READY" = "200" ]; then
              echo "Healthy."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Health check failed after 150s (frontend=$FE api=$API ready=$READY)"
          exit 1

      - name: Signed-in smoke check
        # Warn-only for now: it becomes a gate (and joins the roll-back condition) after it has passed on several real deploys.
        id: smoke
        continue-on-error: true
        run: |
          set -uo pipefail
          bash "$GITHUB_WORKSPACE/deploy/smoke-test.sh" || { echo "::warning::Signed-in smoke check failed"; exit 1; }

      - name: Prune dangling images
        # Success path only (default if: success()). Dangling images only; the :local and :rollback tags are tagged, so they stay.
        run: docker image prune -f || true

      - name: Install backup scripts
        # After the health check and the prune: the new stack is live and healthy, so this step can never block or roll back a deploy.
        # Its id is not in the rollback condition (deploy or health failing); continue-on-error keeps a failure here from reddening a good deploy.
        # The nightly cron line is the owner's to install (docs/runbooks/backups.md); this only places the scripts outside the rsync --delete tree.
        id: backup-scripts
        continue-on-error: true
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/odip-backup/bin"
          install -m 755 "$GITHUB_WORKSPACE/deploy/predeploy-dump.sh" "$GITHUB_WORKSPACE/deploy/backup-nightly.sh" "$HOME/odip-backup/bin/"

      - name: Roll back on failed deploy or health check
        if: failure() && (steps.deploy.outcome == 'failure' || steps.health.outcome == 'failure')
        run: |
          set -euo pipefail
          # Reached when compose up -d gave up waiting for api to be healthy, or the end-to-end probe failed.
          cd "$STACK_DIR"
          # Keep the failed containers' logs in this run before the rollback recreates them; never changes the outcome.
          docker compose logs --tail 200 api db || true
          ROLLED=0
          for img in odip-api odip-frontend; do
            if docker image inspect "$img:rollback" >/dev/null 2>&1; then
              docker tag "$img:rollback" "$img:local"
              ROLLED=1
            fi
          done
          if [ "$ROLLED" = "1" ]; then
            # This up -d also blocks on the api container's healthcheck
            # (deploy/compose.yaml), same as the initial Deploy step.
            docker compose up -d
            echo "::warning::Deploy failed health check — rolled back to previous images"
          else
            echo "::error::Deploy failed and no rollback images exist"
          fi

      - name: Report
        if: always()
        run: |
          cd "$STACK_DIR"
          echo "Signed-in smoke check: ${{ steps.smoke.outcome }}"
          docker compose ps --format '{{.Name}}\t{{.State}}\t{{.Status}}'
